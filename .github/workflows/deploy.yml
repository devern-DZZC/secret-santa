name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      # Checks the real draw without printing it. Output shows test names only.
      - name: Unit and draw tests
        run: npm test

      - name: Install browser for e2e tests
        run: npx playwright install --with-deps chromium

      # Uses the public fixture draw, never the real one.
      - name: Mobile e2e tests
        run: npm run test:e2e

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
